name: libpgandroid
description: >
  Wrapper layer that turns PostgreSQL 17 into an embeddable Android library.
  Provides C API (pgandroid_init/exec/close), JNI bridge for Kotlin/Java,
  in-memory wire protocol I/O buffers, initdb integration, and build.sh that
  compiles everything into a single libpgandroid.so (15MB, arm64).

organization: progalaxyelabs
license: PostgreSQL
repository: https://github.com/progalaxyelabs/libpgandroid

tech_stack:
  language: C (core), Kotlin (JNI bridge), Java (JNI interface)
  build_system: bash (build.sh) + Android NDK toolchain
  target_platform: Android (API 29+, Android 10+)
  target_architectures:
    - aarch64 (arm64-v8a) - primary
    - x86_64 - emulator testing only
  postgresql_version: "17.8"
  postgresql_source: ../postgres-pgandroid (sibling repo)

dependencies:
  build_time:
    - android-ndk: ">=r27 (set $ANDROID_NDK_HOME)"
    - postgres-pgandroid: "sibling repo, compiled via build.sh --pg-src"
  bundled:
    - openssl: "3.x (cross-compiled in deps/openssl-android-arm64/)"
  optional:
    - android-sdk: "for building test APK only"
    - gradle: "8.x (for test APK only)"

extensions:
  included:
    - pgcrypto: "gen_random_uuid(), crypt(), pgp_sym_encrypt()"
  planned:
    - plpgsql: "PL/pgSQL (needs $libdir setup)"
    - pg_trgm: "fuzzy text search"

key_files:
  api:
    - src/pgandroid_main.c: "C API: pgandroid_init, exec, close, backend thread"
    - src/pgandroid_io.c: "in-memory wire protocol I/O with pthread sync"
    - src/pgandroid_initdb.c: "frontend TU: popen/pclose interception, initdb"
    - src/libpgandroid.h: "public C API header"
  jni:
    - jni/pgandroid_jni.c: "JNI bridge for Kotlin/Java"
    - jni/pgandroid.h: "JNI API header"
  build:
    - build.sh: "unified build script (--pg-src for custom PG source)"
    - env.sh: "NDK environment setup (source before build)"

artifacts:
  primary: libpgandroid.so
  headers:
    - libpgandroid.h (C API)
    - pgandroid.h (extended API)
  jni_bridge: pgandroid-jni.aar (planned)

target_use_case: >
  Embedded PostgreSQL for Android apps. Single-user, single-connection,
  no server required. Full SQL dialect including DDL, DML, aggregates,
  gen_random_uuid(). Designed for offline-first mobile apps.

status: active
created: 2026-02-22
